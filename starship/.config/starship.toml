# My One Dark palette.
palette = "onedark"

# Prompt layout.
format = """
$hostname\
$directory\
$git_branch\
$git_metrics\
$fill\
$line_break\
$character"""

# Fill the empty space between path/git info and the prompt character.
[fill]
symbol = "―"
style = "bold grey"

# Keep the same prompt character for success and errors.
[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold blue)"

# Atom One Dark colors.
[palettes.onedark]
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
orange = "#d19a66"
blue = "#61afef"
purple = "#c678dd"
cyan = "#56b6c2"
fg = "#abb2bf"
grey = "#5c6370"
bg3 = "#3e4451"
bg2 = "#2c323c"
bg = "#282c34"

# Keep the Google Cloud account out of the prompt.
[gcloud]
disabled = true

# Always show the hostname, local Mac included.
[hostname]
ssh_only = false
ssh_symbol = "🌐 "
format = "[$ssh_symbol$hostname]($style) "
style = "bold orange"

# Keep long paths from taking the whole prompt.
[directory]
truncation_length = 8 # up to 8 folders deep
truncate_to_repo = true # stop at the repo root in git projects

# Show local branch changes against origin.
[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
