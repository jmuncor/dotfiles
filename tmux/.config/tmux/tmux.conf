# -----------------------------------------------------------------------------
# Minimal One Dark Configuration
# -----------------------------------------------------------------------------

# 1. Environment & Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# OSC 52 clipboard passthrough, so copy reaches the LOCAL clipboard over SSH.
# Needs tmux >= 3.2 (Ubuntu LTS ships 3.2a on 22.04, 3.4 on 24.04).
# On an older tmux (< 3.2) swap the three lines below for:
#   set -ga terminal-overrides ',xterm*:Ms=\E]52;c;%p2%s\7'
# NOTE: run `tmux kill-server` (detach all clients first) for changes to apply.
set -g set-clipboard on
set -g allow-passthrough on
set -g terminal-features 'xterm*:clipboard'

# 2. General Settings
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -sg escape-time 0
set -g history-limit 10000

# 3. Keybindings
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5
bind -n M-H previous-window
bind -n M-L next-window
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# 4. Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# 5. Theme: One Dark status line (built by hand, no theme plugin)
# Atom One Dark palette: bg #282c34, grey #5c6370, fg #abb2bf, blue #61afef.
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#282c34,fg=#5c6370"

# Left: nothing (window list starts at the edge)
set -g status-left ""
set -g status-left-length 0

# Right: weekday, date, and clock (blue accent on the time)
set -g status-right "#[fg=#abb2bf] %a %b %d  #[fg=#61afef]%I:%M %p "
set -g status-right-length 40

# Window list: inactive in grey, current highlighted on a blue pill
set -g window-status-separator ""
set -g window-status-format "#[fg=#5c6370] #I #W "
set -g window-status-current-format "#[fg=#282c34,bg=#61afef] #I #W "

# Pane borders, messages, and copy-mode selection
set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#61afef"
set -g message-style "bg=#3e4451,fg=#abb2bf"
set -g mode-style "bg=#3e4451,fg=#abb2bf"

# 6. Initialize TPM (must be last)
run '~/.config/tmux/plugins/tpm/tpm'
