[terminal.shell]
program = "/opt/homebrew/bin/bash"
args = ["--login"]

[terminal]
osc52 = "CopyPaste"

[window]
decorations = "None"
opacity = 0.97
blur = true
option_as_alt = "Both"
padding = { x = 8, y = 8 }
dynamic_padding = true

[font]
size = 14.0
normal = { family = "Lilex Nerd Font", style = "Regular" }
bold = { family = "Lilex Nerd Font", style = "Bold" }
italic = { family = "Lilex Nerd Font", style = "Italic" }
bold_italic = { family = "Lilex Nerd Font", style = "Bold Italic" }

[scrolling]
history = 10000

# Atom One Dark colors.
[colors.primary]
background = "#282c34"
foreground = "#abb2bf"

[colors.cursor]
text = "#282c34"
cursor = "#abb2bf"

[colors.selection]
text = "CellForeground"
background = "#3e4451"

[colors.normal]
black   = "#282c34"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#abb2bf"

[colors.bright]
black   = "#5c6370"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#ffffff"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\\u001B\\r"

[[keyboard.bindings]]
key = "Return"
mods = "Command"
action = "ToggleFullscreen"
