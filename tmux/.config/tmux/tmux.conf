# Juancho's tmux config: small, One Dark-ish, and portable.

# Shell and terminal support.
set -g default-terminal "tmux-256color"
if-shell '[ "$(uname -s)" = "Darwin" ] && [ -x /opt/homebrew/bin/bash ]' 'set -g default-shell /opt/homebrew/bin/bash'
if-shell '[ "$(uname -s)" = "Darwin" ] && [ -x /opt/homebrew/bin/bash ]' 'set -g default-command "/opt/homebrew/bin/bash --login"'
if-shell '[ "$(uname -s)" = "Linux" ] && [ -x /usr/bin/bash ]' 'set -g default-shell /usr/bin/bash'
if-shell '[ "$(uname -s)" = "Linux" ] && [ -x /usr/bin/bash ]' 'set -g default-command "/usr/bin/bash --login"'
set -ag terminal-overrides ",*:RGB"

# OSC 52 gets copy all the way back to the local clipboard over SSH.
# This needs tmux 3.2+. On older tmux, use:
#   set -ga terminal-overrides ',xterm*:Ms=\E]52;c;%p2%s\7'
# Run `tmux kill-server` after changing this; existing servers keep old options.
set -g set-clipboard on
set -g allow-passthrough on
set -g terminal-features 'xterm*:clipboard'

# General defaults.
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -sg escape-time 0
set -g history-limit 10000

# Keybindings.
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5
bind -n M-H previous-window
bind -n M-L next-window
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Hand-rolled One Dark statusline; no theme plugin.
# Palette: bg #282c34, grey #5c6370, fg #abb2bf, blue #61afef.
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#282c34,fg=#5c6370"

# No left segment; let the window list start at the edge.
set -g status-left ""
set -g status-left-length 0

# Weekday, date, and clock on the right.
set -g status-right "#[fg=#abb2bf] %a %b %d  #[fg=#61afef]%I:%M %p "
set -g status-right-length 40

# Window list: quiet inactive windows, blue current window.
set -g window-status-separator ""
set -g window-status-format "#[fg=#5c6370] #I #W "
set -g window-status-current-format "#[fg=#282c34,bg=#61afef] #I #W "

# Borders, messages, and copy-mode selection.
set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#61afef"
set -g message-style "bg=#3e4451,fg=#abb2bf"
set -g mode-style "bg=#3e4451,fg=#abb2bf"

# TPM has to run last.
run '~/.config/tmux/plugins/tpm/tpm'
